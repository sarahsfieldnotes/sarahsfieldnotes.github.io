# ── Published stories: give them a url and they link out ────

[[work]]
title = "EPA's Toxics Release Inventory Ranks Red Dog Mine as Top Polluter in the Country"
description = "Alaska continues to rank among the US’s top polluters, with 897.8 million pounds of chemicals disposed of onto the land – meaning the state of Alaska was responsible for more than 40 percent of the nation’s total chemical releases."
url = "https://www.akaction.org/news/archive-newsroom/epa-releases-updated-2023-data-for-the-toxics-release-inventory/"
image = "media/work/bike-lanes.jpg"
date = "November 2024"
category = "Journalism"
outlet = "Alaska Community Action on Toxics"

[[work]]
title = "Sivuqaq’s Community-Driven Science: Documenting Contamination in the Arctic"
description = "Due to a combination of global distillation processes and military contamination, the Yupik people of Sivuqaq experience disproportionately high exposure to persistent organic pollutants (POPs) and other chemicals — resulting in dramatic health disparities."
url = "https://www.healthandenvironment.org/latest-research/blog/sivuqaqs-community-driven-science-documenting-contamination-in-the-arctic"
image = "sivuqaq.png"
date = "August 2023"
category = "Journalism"
outlet = "Collaborative for Health & Environment"


