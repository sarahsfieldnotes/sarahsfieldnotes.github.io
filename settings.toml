# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """
I'm a master’s student pursuing concurrent degrees in public health and multimedia 
journalism at UC Berkeley. 
I work at the intersection of human and planetary health and am interested in using 
science communication to advance community-led environmental justice.

My reporting covers housing, transportation, and food access in the East
Bay. I write for Richmond Confidential and spent last summer as a
reporting intern with the SF Chronicle, where I learned that the best
stories usually start at a bus stop, a taquería or a city council
meeting that runs past midnight.

"""

